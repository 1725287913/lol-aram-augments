<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1017">
<meta name="description" content="海克斯大乱斗英雄出装与海克斯推荐 · 真实对局数据">
<title>海斗指南 · 海克斯大乱斗</title>
<link rel="stylesheet" href="assets/css/main.css?v=20261029f">
</head>
<body>

<!-- 英雄海报背景：切英雄时换图，全局固定 -->
<div class="hero-bg" id="heroBg" aria-hidden="true">
  <img class="hero-bg-img" id="heroBgImg" alt="" />
  <div class="hero-bg-veil"></div>
</div>

<header class="topbar">
  <div class="tb-left">
    <button class="navbtn navbtn-icon only-mobile" id="openSide" title="选择英雄" aria-label="选择英雄">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-text">海斗指南</span>
    </div>
  </div>

  <div class="search">
    <svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="搜英雄 / 拼音首字母，如 zdr" autocomplete="off" spellcheck="false">
    <button class="search-clear" id="qClear" aria-label="清空">✕</button>
  </div>

  <div class="tb-right">
    <span class="meta" id="patchInfo" title="数据版本与更新日期"></span>
    <button class="navbtn" id="randomHero" title="随机一个英雄（R）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/></svg>
      <span>随机</span>
    </button>
    <button class="navbtn" id="openQuiz" title="三选一训练（Q）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7.5" width="12" height="13.5" rx="2.5"/><path d="M7 4.5h11.5A2.5 2.5 0 0 1 21 7v11"/><path d="M6 12h5M6 15.5h5"/></svg>
      <span>三选一</span>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <span id="sideTitle">全部英雄</span>
      <span class="count" id="heroCount">—</span>
    </div>
    <div class="hero-grid" id="heroGrid"></div>
    <div class="side-foot">
      <button class="sf-btn" data-act="random">随机一个</button>
      <button class="sf-btn" data-act="quiz">三选一</button>
    </div>
  </aside>
  <div class="side-mask" id="sideMask"></div>

  <main class="content" id="content">
    <div class="empty-state">
      <div class="empty-icon"></div>
      <p>从左侧选一个英雄</p>
    </div>
  </main>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" id="modalCard"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/app.js?v=20261029f"></script>
<script>
/* 版本自检：手机上容易吃到旧缓存，版本不一致就自动刷一次 */
(function () {
  var el = document.querySelector('script[src*="assets/js/app.js"]');
  var cur = el ? (el.src.split('v=')[1] || '').slice(0, 12) : '';
  if (!cur) return;
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var nv = (t || '').trim();
      if (!nv || nv === cur) return;
      if (sessionStorage.getItem('hd_v') === nv) return;
      sessionStorage.setItem('hd_v', nv);
      location.reload();
    })
    .catch(function () {});
})();
</script>
</body>
</html>
